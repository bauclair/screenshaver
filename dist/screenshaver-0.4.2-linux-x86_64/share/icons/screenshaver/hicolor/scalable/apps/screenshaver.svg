<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Screenshaver icon</title>
  <desc id="desc">
    A square rainbow gradient from red at the top to blue at the bottom,
    overlaid with a bold black diagonal T.
  </desc>

  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff0000"/>
      <stop offset="18%"  stop-color="#ff6a00"/>
      <stop offset="42%"  stop-color="#fff200"/>
      <stop offset="67%"  stop-color="#45e000"/>
      <stop offset="84%"  stop-color="#00b878"/>
      <stop offset="100%" stop-color="#004cff"/>
    </linearGradient>

    <clipPath id="iconClip">
      <rect x="16" y="16" width="992" height="992"/>
    </clipPath>
  </defs>

  <!-- Gradient field -->
  <rect x="16" y="16" width="992" height="992" fill="url(#rainbow)"/>

  <!-- Diagonal T, clipped cleanly to the icon square -->
  <g clip-path="url(#iconClip)" fill="#000000">
    <!-- Uniform crossbar from lower-left to upper-right -->
    <polygon points="
      -34,944
      72,1050
      1058,64
      952,-42
    "/>

    <!-- Thicker foot running to and through the lower-right corner -->
    <polygon points="
      518,490
      615,393
      1070,848
      1070,1070
      848,1070
    "/>
  </g>

  <!-- Crisp outer border -->
  <rect x="8" y="8" width="1008" height="1008"
        fill="none" stroke="#000000" stroke-width="16"/>
</svg>
